
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Self Notify</title>

  <link rel="icon" href="./assets/favicon.ico">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
</head>
<body>

<style>
  #setup {
    padding-top: 25px;
  }

  #vapidKey {
    display: block;
    width: 90%;
    max-width: 900px;
    height: 55px;
    margin-top: 12px;
    padding: 10px;
    font-size: 15px;
    box-sizing: border-box;
  }

  #subscribe {
    margin-top: 15px;
  }
</style>

<div id="setup" style="display: none;">
  <label for="vapidKey">VAPID public key:</label>
  <textarea
    id="vapidKey"
    autocomplete="off"
    spellcheck="false"
    placeholder="Paste the base64url public key here (87 chars, starts with B)"
  ></textarea>

  <button id="subscribe">Get Keys</button>
  <pre id="output"></pre>
</div>

<div id="installMessage" style="display: none;">
  Please add this page to your home screen to set up notifications.
</div>

<script>
const isIOS =
  /iPhone|iPad|iPod/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

const isStandalone =
  navigator.standalone === true ||
  window.matchMedia("(display-mode: standalone)").matches;

if (isIOS && !isStandalone) {
  document.querySelector("#installMessage").style.display = "block";
} else {
  document.querySelector("#setup").style.display = "block";
}
</script>

<script>
  const keyInput = document.querySelector("#vapidKey");
  const output = document.querySelector("#output");

  keyInput.value = localStorage.getItem("vapidPublicKey") || "";

  function base64UrlToBytes(value) {
    const padded = value + "=".repeat((4 - value.length % 4) % 4);
    const raw = atob(padded.replace(/-/g, "+").replace(/_/g, "/"));
    return Uint8Array.from(raw, c => c.charCodeAt(0));
  }

  function downloadJson(filename, text) {
    const blob = new Blob([text], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  document.querySelector("#subscribe").onclick = async () => {
    try {
      const vapidPublicKey = keyInput.value.trim();
      if (!vapidPublicKey) {
        throw new Error("Enter the VAPID public key first.");
      }

      const keyBytes = base64UrlToBytes(vapidPublicKey);
      localStorage.setItem("vapidPublicKey", vapidPublicKey);

      if (!("serviceWorker" in navigator) ||
          !("PushManager" in window)) {
        throw new Error("Push is not supported by this browser.");
      }

      const permission = await Notification.requestPermission();
      if (permission !== "granted") {
        throw new Error("Notification permission was not granted.");
      }

      await navigator.serviceWorker.register("./sw.js");
      const registration = await navigator.serviceWorker.ready;

      const subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: keyBytes
      });

      const json = JSON.stringify(subscription, null, 2);
      console.log(json);

      downloadJson("keys.json", json);
      output.textContent = "keys.json";
    } catch (error) {
      output.textContent = error.message;
    }
  };
</script>

</body>
</html>
